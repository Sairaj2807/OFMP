# Production stack. See docs/deployment.md.
#   cp .env.production.example .env.production   # fill in secrets; never commit it
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only nginx is published. The database, Redis, API and worker live on internal
# networks; Grafana binds to localhost (reach it through an SSH tunnel).
name: ofmp

x-backend: &backend
  build: { context: ., dockerfile: Dockerfile, target: runtime }
  image: ofmp-backend:${OFMP_VERSION:-latest}
  env_file: ${OFMP_ENV_FILE:-.env.production}
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-production}
    DATABASE_URL: postgresql+asyncpg://ofmp:${POSTGRES_PASSWORD}@timescaledb:5432/ofmp
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    INGEST_MODE: redis
  volumes:
    - ofmp-data:/app/data
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ofmp
      POSTGRES_DB: ofmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - ofmp-pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofmp -d ofmp"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 256m
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "no",
              "--save", "", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *backend
    command: ["python", "-m", "backend.app.cli", "migrate"]
    restart: "no"
    networks: [data]
    depends_on:
      timescaledb: { condition: service_healthy }

  api:
    <<: *backend
    networks: [data, edge, monitoring]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["python", "-m", "backend.app.workers.ingest"]
    networks: [data, monitoring, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3

  nginx:
    build: { context: ., dockerfile: deploy/nginx/Dockerfile }
    image: ofmp-nginx:${OFMP_VERSION:-latest}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d",
              "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ofmp-prometheus:/prometheus
    networks: [monitoring]
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ofmp-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    networks: [monitoring]
    restart: unless-stopped
    logging: *logging

  # Certificate issuance/renewal (Let's Encrypt, webroot). See docs/deployment.md.
  certbot:
    image: certbot/certbot:v3.0.1
    profiles: ["certbot"]
    volumes:
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

networks:
  edge: {}                        # nginx <-> api
  data: { internal: true }        # api/worker <-> database, redis (no internet)
  monitoring: {}                  # prometheus -> api/worker; grafana -> prometheus
  egress: {}                      # worker -> broker (outbound internet)

volumes:
  ofmp-pgdata: {}
  ofmp-data: {}
  ofmp-prometheus: {}
  ofmp-grafana: {}
  certbot-webroot: {}
