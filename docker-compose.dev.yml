# Local development services for OFMP. Ports are offset (55432, 56379) so they
# never collide with other projects' Postgres/Redis on the default ports.
#   docker compose -f docker-compose.dev.yml up -d
name: ofmp-dev

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ofmp
      POSTGRES_PASSWORD: ofmp_dev_password     # development only
      POSTGRES_DB: ofmp
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ofmp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofmp -d ofmp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped

volumes:
  ofmp-pgdata:
