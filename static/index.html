<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NIFTY FUT — Order Book &amp; Order Flow</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="symbol-block">
      <span id="symbol">—</span>
      <span id="status-dot" class="dot disconnected"></span>
      <span id="status-text">connecting…</span>
    </div>
    <div class="contract-switch">
      <label for="contract-select" class="sr-only">Contract</label>
      <select id="contract-select"></select>
    </div>
    <nav class="view-nav">
      <a href="/" class="active">Live</a>
      <a href="/replay">Orderflow Replay</a>
      <a href="/chart">Footprint Chart</a>
    </nav>
    <div class="unit-toggle" role="group" aria-label="Quantity units">
      <button id="unit-qty" class="unit-btn active" type="button">Qty</button>
      <button id="unit-lots" class="unit-btn" type="button">Lots</button>
    </div>
    <div class="quote-block">
      <div class="q"><label>LTP</label><span id="q-ltp">—</span></div>
      <div class="q"><label>O</label><span id="q-open">—</span></div>
      <div class="q"><label>H</label><span id="q-high">—</span></div>
      <div class="q"><label>L</label><span id="q-low">—</span></div>
      <div class="q"><label>C</label><span id="q-close">—</span></div>
      <div class="q"><label>OI</label><span id="q-oi">—</span></div>
      <div class="q"><label>VOL</label><span id="q-vol">—</span></div>
      <div class="q"><label>TICKS</label><span id="q-ticks">0</span></div>
    </div>
  </header>

  <main>
    <section id="orderbook-panel" class="panel">
      <h2>Order Book</h2>
      <div class="ob-stats">
        <div><label>Spread</label><span id="ob-spread">—</span></div>
        <div><label>Mid</label><span id="ob-mid">—</span></div>
        <div><label>Micro</label><span id="ob-micro">—</span></div>
        <div class="obi-wrap">
          <label>OBI</label>
          <div class="obi-bar"><div id="obi-fill" class="obi-fill"></div></div>
          <span id="ob-obi">0.00</span>
        </div>
      </div>
      <table id="ob-table">
        <thead>
          <tr><th>Orders</th><th>Qty</th><th>Price</th><th>Price</th><th>Qty</th><th>Orders</th></tr>
        </thead>
        <tbody id="ob-asks-body"></tbody>
        <tbody id="ob-bids-body"></tbody>
      </table>
    </section>

    <section id="orderflow-panel" class="panel">
      <div class="panel-head">
        <h2>Order Flow — Footprint</h2>
        <div class="panel-head-controls">
          <div class="ppr-select-wrap">
            <label for="interval-select">Interval</label>
            <select id="interval-select">
              <option value="60">1m</option>
              <option value="180">3m</option>
              <option value="300">5m</option>
              <option value="900">15m</option>
              <option value="1800">30m</option>
            </select>
          </div>
          <div class="ppr-select-wrap">
            <label for="ppr-select">Price/Row</label>
            <select id="ppr-select">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>
      </div>
      <div class="of-stats">
        <div><label>Session CVD</label><span id="of-cvd">0</span></div>
        <div><label>Candle Δ</label><span id="of-delta">0</span></div>
        <div id="of-imbalances" class="badges"></div>
      </div>
      <canvas id="cvd-canvas" width="900" height="70"></canvas>
      <div id="footprint-scroll">
        <table id="fp-table"></table>
      </div>
    </section>
  </main>

  <script src="/static/render.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
