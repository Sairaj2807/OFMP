<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · OFMP</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<main>
  <section id="signin">
    <h1>Sign in</h1>
    <p class="sub">Order-flow market platform</p>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <div class="links">
      <a href="#" id="show-forgot">Forgot password?</a>
      <a href="#" id="show-register">Create account</a>
    </div>
  </section>

  <section id="forgot" hidden>
    <h1>Reset password</h1>
    <p class="sub">We'll email you a link if the account exists.</p>
    <form id="forgot-form" novalidate>
      <label for="forgot-email">Email</label>
      <input id="forgot-email" type="email" autocomplete="username" required>
      <button type="submit">Send reset link</button>
    </form>
    <div class="links"><a href="#" class="back">Back to sign in</a></div>
  </section>

  <section id="register" hidden>
    <h1>Create account</h1>
    <p class="sub">At least 10 characters, mixing letters with digits or symbols.</p>
    <form id="register-form" novalidate>
      <label for="reg-name">Name</label>
      <input id="reg-name" type="text" autocomplete="name" maxlength="100">
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email" autocomplete="username" required>
      <label for="reg-password">Password</label>
      <input id="reg-password" type="password" autocomplete="new-password" required>
      <button type="submit">Create account</button>
    </form>
    <div class="links"><a href="#" class="back">Back to sign in</a></div>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script src="/static/auth.js"></script>
<script>
  const msg = document.getElementById("msg");
  const sections = ["signin", "forgot", "register"].map((id) => document.getElementById(id));
  function show(id) {
    sections.forEach((s) => (s.hidden = s.id !== id));
    setMessage(msg, "");
    const first = document.querySelector("#" + id + " input");
    if (first) first.focus();
  }
  document.getElementById("show-forgot").onclick = (e) => { e.preventDefault(); show("forgot"); };
  document.getElementById("show-register").onclick = (e) => { e.preventDefault(); show("register"); };
  document.querySelectorAll(".back").forEach((a) => (a.onclick = (e) => { e.preventDefault(); show("signin"); }));

  async function submitting(form, fn) {
    const button = form.querySelector("button");
    button.disabled = true;
    try { await fn(); } finally { button.disabled = false; }
  }

  document.getElementById("login-form").onsubmit = (e) => {
    e.preventDefault();
    submitting(e.target, async () => {
      const r = await api("/api/v1/auth/login", {
        email: document.getElementById("email").value, password: document.getElementById("password").value });
      if (r.ok) location.replace(safeNext());
      else setMessage(msg, errorText(r), "error");
    });
  };

  document.getElementById("forgot-form").onsubmit = (e) => {
    e.preventDefault();
    submitting(e.target, async () => {
      const r = await api("/api/v1/auth/password-reset/request", { email: document.getElementById("forgot-email").value });
      setMessage(msg, r.ok ? r.data.message : errorText(r), r.ok ? "ok" : "error");
    });
  };

  document.getElementById("register-form").onsubmit = (e) => {
    e.preventDefault();
    submitting(e.target, async () => {
      const r = await api("/api/v1/auth/register", {
        display_name: document.getElementById("reg-name").value || null,
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value });
      if (r.ok) { show("signin"); setMessage(msg, r.data.message, "ok"); }
      else setMessage(msg, errorText(r), "error");
    });
  };

  // A still-valid refresh cookie signs straight back in (e.g. access token expired).
  if (csrfToken()) {
    api("/api/v1/auth/refresh").then((r) => { if (r.ok) location.replace(safeNext()); });
  }
  document.getElementById("email").focus();
</script>
</body>
</html>
