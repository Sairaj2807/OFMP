<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · OFMP</title>
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p class="sub">This signs you out on every device.</p>
  <form id="form" novalidate>
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" required>
    <button type="submit">Set password</button>
  </form>
  <div class="links"><a href="/login">Back to sign in</a></div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script src="/static/auth.js"></script>
<script>
  const msg = document.getElementById("msg");
  const token = new URLSearchParams(location.search).get("token");
  if (!token) setMessage(msg, "This link is missing its token. Request a new one from the sign-in page.", "error");
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    if (password !== document.getElementById("confirm").value) return setMessage(msg, "Passwords do not match.", "error");
    const r = await api("/api/v1/auth/password-reset/confirm", { token, new_password: password });
    if (r.ok) { e.target.hidden = true; setMessage(msg, "Password updated. You can sign in now.", "ok"); }
    else setMessage(msg, errorText(r), "error");
  };
  document.getElementById("password").focus();
</script>
</body>
</html>
