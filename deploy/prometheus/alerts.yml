# Alert rules. Delivery (Alertmanager: email/Telegram/webhook) is configured per deployment.
groups:
  - name: ofmp
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.job }} is not being scraped" }

      # Feed alerts only apply while NSE is in session: ofmp_market_session_open comes from the
      # exchange calendar (weekends, holidays and special sessions applied, see
      # backend/app/domain/market_data/calendars/nse.json). "Open for the last 5 minutes"
      # keeps them quiet right after the open, before the first ticks arrive.
      - alert: ProviderDisconnected
        expr: max(ofmp_provider_connected) == 0 and on() min_over_time(max(ofmp_market_session_open)[5m:30s]) == 1
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Market-data provider disconnected during market hours" }

      - alert: NoTicksDuringMarketHours
        expr: (time() - max(ofmp_last_tick_timestamp_seconds)) > 120 and on() min_over_time(max(ofmp_market_session_open)[5m:30s]) == 1
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "No market data for over 2 minutes during market hours" }

      - alert: TickConsumerFailures
        expr: increase(ofmp_ticks_failed_total[5m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Ticks are failing in the engine or publisher" }

      - alert: DatabaseWriterBacklog
        expr: max(ofmp_db_rows_pending) > 50000
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Database writer is falling behind ({{ $value }} rows pending)" }

      - alert: DatabaseRowsDropped
        expr: increase(ofmp_db_rows_dropped_total[10m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Database writer buffer overflowed; rows were dropped" }

      - alert: HighApiErrorRate
        expr: sum(rate(ofmp_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(ofmp_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "More than 5% of API requests are failing" }

      - alert: MarketCalendarOutdated
        expr: min(ofmp_market_calendar_days_left) < 30
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "NSE holiday calendar ends in {{ $value }} days: add next year to calendars/nse.json" }

      - alert: RateLimitRedisFallback
        expr: increase(ofmp_ratelimit_fallbacks_total[10m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Rate limits fell back to per-process limits: Redis is failing" }

      - alert: AlertWebhookFailures
        expr: increase(ofmp_alert_deliveries_total{channel="webhook",outcome="failed"}[15m]) > 5
        labels: { severity: warning }
        annotations: { summary: "User alert webhooks are failing ({{ $value }} in 15 min)" }

      - alert: AlertFiringsDropped
        expr: increase(ofmp_alerts_dropped_total[10m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Alert dispatch queue overflowed; user alerts were lost" }

      - alert: SlowTickProcessing
        expr: histogram_quantile(0.99, sum(rate(ofmp_tick_processing_seconds_bucket[5m])) by (le)) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p99 tick processing above 10 ms" }
