# Security headers for every HTTPS response. `always` also covers error pages.
# nginx does not inherit add_header into a location that defines its own, so
# locations that add headers include this file again.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
include /etc/nginx/snippets/csp.conf;
