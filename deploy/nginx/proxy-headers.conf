# Forwarded headers for every proxied location. nginx does NOT inherit
# proxy_set_header into a location that sets any of its own, so each proxied
# location includes this file instead of relying on server-level settings.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;   # keeps the port: the stream checks Origin against it
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;
