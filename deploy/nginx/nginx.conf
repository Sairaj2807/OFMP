worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    log_format json escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                                '"upstream_rt":"$upstream_response_time","request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Request limits
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Per-IP limits in front of the application's own limits.
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=wsconn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream api { server api:8000; keepalive 16; }

    # --- HTTP: ACME challenges, health, everything else -> HTTPS ------------------
    server {
        listen 80 default_server;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    # --- HTTPS ----------------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        include /etc/nginx/snippets/security-headers.conf;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # Internal only: Prometheus scrapes the API directly on the private network.
        location = /metrics { return 404; }

        # The terminal (static export). Hashed assets are immutable; HTML is revalidated.
        location = /app { return 301 /app/; }
        location /app/_next/static/ {
            alias /usr/share/nginx/app/_next/static/;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location /app/ {
            alias /usr/share/nginx/app/;
            try_files $uri $uri/index.html $uri.html =404;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Real-time streams: long-lived upgraded connections, per-IP connection cap.
        location /ws/ {
            limit_conn wsconn 20;
            proxy_pass http://api;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://api;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_set_header Connection "";
        }

        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_set_header Connection "";
        }
    }
}
